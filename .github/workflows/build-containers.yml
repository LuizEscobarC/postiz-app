---
name: "Build Containers"

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

# [lampagos fork] single source of truth for the image name (ghcr requires a
# lowercase owner). Change only this line to retarget the registry.
env:
  IMAGE: ghcr.io/luizescobarc/postiz-app

permissions:
  contents: read
  packages: write

jobs:
  build-containers-common:
    runs-on: ubuntu-latest
    outputs:
      containerver: ${{ steps.getcontainerver.outputs.containerver }}
    steps:
      - name: Get Container Version
        id: getcontainerver
        run: |
          echo "containerver=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"

  build-containers:
    needs: build-containers-common
    strategy:
      matrix:
        include:
          - runnertags: ubuntu-latest
            arch: amd64
          # [lampagos fork] arm64 disabled: production is x86_64 (Hetzner).
          # Re-enable by uncommenting these two lines AND flipping ARM64 in the
          # manifest job below.
          # - runnertags: ubuntu-24.04-arm
          #   arch: arm64
    runs-on: ${{ matrix.runnertags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and Push Image
        env:
          CONTAINERVER: ${{ needs.build-containers-common.outputs.containerver }}
          NEXT_PUBLIC_VERSION: ${{ github.ref_name }}
        run: |
          docker buildx build --platform linux/${{ matrix.arch }} \
            -f Dockerfile.dev \
            -t "$IMAGE:${{ env.CONTAINERVER }}-${{ matrix.arch }}" \
            --build-arg NEXT_PUBLIC_VERSION=${{ env.NEXT_PUBLIC_VERSION }} \
            --pull \
            --no-cache \
            --provenance=false --sbom=false \
            --output "type=registry,name=$IMAGE:${{ env.CONTAINERVER }}-${{ matrix.arch }}" .

  build-container-manifest:
    needs: [build-containers, build-containers-common]
    runs-on: ubuntu-latest
    steps:
      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Create Docker Manifest
        env:
          CONTAINERVER: ${{ needs.build-containers-common.outputs.containerver }}
          # [lampagos fork] set to "true" when the arm64 matrix entry is enabled
          ARM64: "false"
        run: |
          AMEND="--amend $IMAGE:$CONTAINERVER-amd64"
          docker buildx imagetools inspect "$IMAGE:$CONTAINERVER-amd64"
          if [ "$ARM64" = "true" ]; then
            docker buildx imagetools inspect "$IMAGE:$CONTAINERVER-arm64"
            AMEND="$AMEND --amend $IMAGE:$CONTAINERVER-arm64"
          fi

          # Try to remove any existing manifest first
          docker manifest rm "$IMAGE:$CONTAINERVER" || true

          # Create and push the version-specific manifest.
          # No :latest tag on this fork: deploys pin by digest and a floating
          # tag would only invite confusion with upstream's image.
          docker manifest create "$IMAGE:$CONTAINERVER" $AMEND
          docker manifest push "$IMAGE:$CONTAINERVER"

      - name: Verify Manifest
        env:
          CONTAINERVER: ${{ needs.build-containers-common.outputs.containerver }}
        run: |
          docker manifest inspect "$IMAGE:$CONTAINERVER"
